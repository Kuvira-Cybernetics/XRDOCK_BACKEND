<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Successful</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #060918;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 400px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            max-width: 200px;
            margin-bottom: 1.5rem;
        }

        h1 {
            color: #A855F7;
            margin-bottom: 1rem;
            font-size: 1.8rem;
            font-weight: 700;
        }

        p {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        b {
            color: #C084FC;
        }

        .icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #A855F7, #7F00FF);
            color: white;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="logo.png" alt="XRDOCK Logo" class="logo" onerror="this.style.display='none'">
        <div class="icon">✓</div>
        <h1>Authentication Successful!</h1>
        <p>You have successfully logged in via Autodesk.</p>
        <p>You can now close this tab and return to <b>Unity/XRDock</b>.</p>
    </div>
</body>

</html>
